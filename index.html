<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Arre's Climb</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1117;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;font-family:monospace}#app{position:relative;display:flex;align-items:center;justify-content:center}canvas{display:block;image-rendering:pixelated}#b{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:8px 20px;background:rgba(13,17,23,.88);border:2px solid #58a6ff;border-radius:8px;color:#fff;font:bold 15px monospace;text-align:center;pointer-events:none;transition:opacity .4s;opacity:0;z-index:1000}#title-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(13,17,23,.75);z-index:500;transition:opacity .3s}#logo{image-rendering:pixelated;width:192px;height:96px}.btn{padding:10px 24px;font:bold 16px monospace;color:#fff;background:#238636;border:2px solid #2ea043;border-radius:6px;cursor:pointer;transition:transform .1s,background .2s}.btn:hover{background:#2ea043;transform:scale(1.04)}.btn-sub{padding:6px 16px;font-size:13px;background:#21262d;border-color:#30363d}.btn-sub:hover{background:#30363d}.hints{color:#8b949e;font-size:12px;text-align:center;line-height:1.5}</style></head><body><div id="app"><div id="title-screen"><canvas id="logo" width="64" height="32"></canvas><div id="btn-group" style="display:flex;flex-direction:column;gap:8px;align-items:center"><button id="start-btn" class="btn">▶ START GAME</button></div><div class="hints">WASD / Arrow Keys: Move • Space: Jump<br>Q / E: Rotate Camera • M: Mute</div></div></div><div id="b"></div><script type="module" src="/src/main.js"></script></body></html>
