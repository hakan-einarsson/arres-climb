<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arre's Climb</title>
  <style>
    body { margin: 0; background: #1a1e29; overflow: hidden; }
    #b {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 24px;
      background: rgba(13, 17, 23, 0.88);
      border: 2px solid #58a6ff;
      border-radius: 8px;
      color: #fff;
      font: bold 16px Consolas, monospace;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.4s;
      opacity: 0;
      z-index: 1000;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="b"></div>
  <script type="module" src="/src/main.js"></script>
